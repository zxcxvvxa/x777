global
    log stdout format raw local0 warning
    maxconn 65535
    tune.bufsize 65536
    tune.rcvbuf.client 65536
    tune.rcvbuf.server 65536

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  tcp-smart-accept
    option  tcp-smart-connect
    
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout tunnel          1h
    timeout client-fin      30s
    timeout server-fin      30s

frontend cloudrun_ingress
    bind *:8080

    # Health check
    acl is_health path -i /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    # Xray routes
    acl path_trojan path /ima0hw
    acl path_vless path /whoami
    
    use_backend bk_trojan if path_trojan
    use_backend bk_vless if path_vless

    # Default: Redirect to wtfismyip.com instead of static text
    default_backend bk_redirect

# Xray backends (matches your ports/paths)
backend bk_trojan
    server xray 127.0.0.1:10000

backend bk_vless
    server xray 127.0.0.1:10001

# Redirect only – no extra server
backend bk_redirect
    http-request redirect location https://wtfismyip.com/ code 302
